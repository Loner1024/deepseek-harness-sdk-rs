name: CI

# Format, clippy, and the fake-runtime test suite on both supported
# platforms. The keyless smoke test self-skips without the runtime
# environment variables; the upstream deepseek-harness repository drives it
# against the real runtime executable.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / cargo test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the toolchain (with clippy and rustfmt);
      # rustup installs it when the first cargo command runs.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --features test-support -- -D warnings

      - name: Test
        run: cargo test --features test-support
